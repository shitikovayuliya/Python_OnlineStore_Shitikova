# =============================================================================
# Docker Compose для интернет-магазина
# =============================================================================
# Сервисы:
#   - db: PostgreSQL 16 с healthcheck
#   - web: Django + Gunicorn с автозапуском миграций

services:
  # База данных PostgreSQL
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
      POSTGRES_DB: ${DB_NAME:-mydatabase}
    volumes:
      - db-data:/var/lib/postgresql/data/  # Персистентное хранилище
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-myuser} -d ${DB_NAME:-mydatabase}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Веб-приложение (Django + Gunicorn)
  web:
    build: .
    env_file:
      - .env  # Загружает SECRET_KEY, DEBUG, DB_* из .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --no-input &&
             gunicorn onlinestore.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app  # Mount для разработки (hot-reload)
    ports:
      - "8000:8000"  # Доступ по http://localhost:8000
    depends_on:
      db:
        condition: service_healthy  # Ждём готовности БД

# Именованные тома для персистентности
volumes:
  db-data:

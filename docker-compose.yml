services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    volumes:
      - db-data:/var/lib/postgresql/data/

  web:
    build: .
    command: >
      sh -c "while ! python -c 'import socket; socket.create_connection((\"db\", 5432), timeout=2)' 2>/dev/null; do echo 'Waiting for db...'; sleep 2; done &&
             python manage.py migrate &&
             python manage.py collectstatic --no-input &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db-data:

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Интернет-магазин{% endblock %}</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; }
        .product-card { border: 1px solid #ccc; padding: 15px; margin: 10px 0; }
    </style>
</head>
<body>
    <nav>
        {% if messages %}
    {% for message in messages %}
        <div style="padding: 10px; margin: 10px 0; border: 1px solid {% if message.tags == 'error' %}red{% else %}green{% endif %};">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

        <a href="{% url 'home' %}">Главная</a>
        <a href="{% url 'product_list' %}">Каталог</a>
        <a href="{% url 'category_list' %}">Категории</a>
        <a href="{% url 'cart' %}">Корзина</a>
        <a href="{% url 'order_list' %}">Заказы</a>
        {% if user.is_authenticated %}
            <span>Привет, {{ user.username }}</span>
            <a href="{% url 'logout' %}">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
